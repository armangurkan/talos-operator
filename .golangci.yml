# .golangci.yml
version: "2"
run:
  go: "1.25"
  tests: true
  timeout: 10m
  relative-path-mode: gomod
  modules-download-mode: readonly
linters:
  default: all
  exclusions:
    generated: strict
    warn-unused: true
    presets: []
    paths:
      - vendor$
      - third_party$
      - builtin$
      - examples$
  disable:
    - wsl
    - wsl_v5
    # Duplicate cyclomatic complexity — cyclop is newer and supports package-average
    - gocyclo
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    # -------------------------------
    # Complexity / maintainability
    # -------------------------------
    cyclop:
      max-complexity: 15
      package-average: 10.0
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    funlen:
      lines: 80
      statements: 40
      ignore-comments: true
    maintidx:
      under: 40
    interfacebloat:
      max: 5
    # -------------------------------
    # Error handling discipline
    # -------------------------------
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
    # -------------------------------
    # Security
    # -------------------------------
    gosec:
      severity: low
      confidence: low
      config:
        global:
          audit: true
    # -------------------------------
    # Go vet + critic (authoritative)
    # -------------------------------
    govet:
      enable-all: true
    gocritic:
      enable-all: true
    # -------------------------------
    # Revive — rules owned by dedicated linters are disabled
    # -------------------------------
    revive:
      severity: error
      enable-all-rules: true
      enable-default-rules: true
      rules:
        # → cyclop owns this (newer, package-average support)
        - name: cyclomatic
          disabled: true
        # → gocognit owns this
        - name: cognitive-complexity
          disabled: true
        # → funlen owns this (more granular controls)
        - name: function-length
          disabled: true
        # → errcheck owns this (stricter mode)
        - name: unhandled-error
          disabled: true
        # → varnamelen owns this (scope-aware)
        - name: var-naming
          disabled: true
        # → nestif owns this
        - name: nested-structs
          disabled: true
        # → gocritic (enable-all) owns these
        - name: early-return
          disabled: true
        - name: unused-parameter
          disabled: true
        # → exhaustive linter owns this (also handles flag enums)
        - name: exhaustive-switch
          disabled: true
        # → goconst owns this (configurable min occurrences)
        - name: add-constant
          disabled: true
        # → lll owns this (tab-width aware)
        - name: line-length-limit
          disabled: true
        # → gochecknoglobals owns this
        - name: avoid-global-vars
          disabled: true
        # → govet (enable-all) is authoritative here
        - name: exported
          disabled: true
    # -------------------------------
    # NOLINT policy
    # -------------------------------
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
formatters:
  exclusions:
    generated: strict
    warn-unused: true
    paths:
      - vendor$
      - third_party$
      - builtin$
      - examples$
  settings:
    goimports:
      # local-prefixes:
      # - github.com/yourorg/yourrepo
    gofumpt:
      extra-rules: true
